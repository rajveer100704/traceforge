[project]
name = "traceforge"
version = "0.2.0"
description = "Verifiable agent training and evaluation infrastructure"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rajveer Singh Saggu" }]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "rq>=1.16",
    "boto3>=1.34",
    "pyarrow>=16.0",
    "gymnasium>=1.0",
    "docker>=7.1",
    "httpx>=0.27",
    "tenacity>=8.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "transformers>=4.46",
    "datasets>=3.0",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "mlflow-skinny>=2.16",
]

[project.scripts]
traceforge = "traceforge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "respx>=0.21",
    "fakeredis>=2.23",
    "moto[s3]>=5.0",
    "types-pyyaml>=6.0",
    "types-boto3>=1.0",
    "bandit>=1.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["environments/**/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "N"]
ignore = [
    "S101",   # assert in tests
    "S603",   # subprocess without shell is intended in sandbox runners
    "S607",
    "RUF012",
    "B008",   # FastAPI/Typer Depends/Option defaults
    "N818",
    "RUF001", # typographic dashes/arrows in user-facing strings are intentional
    "RUF002",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "PT011", "B017", "PT018", "E501", "PT006", "SIM115", "PT017"]
"src/traceforge/modules/tasks/families/**" = ["S608", "E501"]
"src/traceforge/infrastructure/database/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["traceforge"]
mypy_path = "src"
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["traceforge.infrastructure.database.migrations.*", "traceforge.modules.tasks.harness.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "docker: requires a running Docker daemon (skipped otherwise)",
    "postgres: requires a reachable PostgreSQL (TRACEFORGE_TEST_POSTGRES_URL)",
    "ml: requires the optional ml dependency group",
    "slow: slower end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning:rq.*"]

[tool.coverage.run]
source = ["traceforge"]
omit = ["*/migrations/*"]

[tool.bandit]
exclude_dirs = ["tests", "src/traceforge/modules/tasks/harness"]
# B105: enum values like "PASS" flagged as passwords; B311: seeded RNG for data order/statistics only
skips = ["B101", "B105", "B311", "B404", "B603"]
